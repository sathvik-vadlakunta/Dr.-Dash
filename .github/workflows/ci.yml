name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drdash
          POSTGRES_PASSWORD: drdash
          POSTGRES_DB: drdash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drdash"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://drdash:drdash@localhost:5432/drdash?schema=public
      SESSION_SECRET: ci-session-secret-value-that-is-long-enough-for-zod
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SEED_DEMO_DATA: "true"
      # check:catalog runs invariant-only in CI; the nightly job adds live
      # FRED metadata verification (Section 23.7).
      FRED_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Point Prisma CLI at the environment
        run: cp .env.example .env.local && ln -sfn .env.local .env

      - run: pnpm prisma migrate deploy
      - run: pnpm prisma generate
      - run: pnpm db:seed

      - run: pnpm verify

      - run: pnpm test:integration

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
